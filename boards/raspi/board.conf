# Board configuration — Raspberry Pi
# Sourced by setup.sh to determine what to clone and configure.

BOARD_NAME="Raspberry Pi"
YOCTO_VERSION="kirkstone"

# Valid machines for this board family
VALID_MACHINES=("qemux86-64" "raspberrypi3" "raspberrypi3-64" "raspberrypi4" "raspberrypi4-64")
DEFAULT_MACHINE="raspberrypi4-64"

# Default image to build
DEFAULT_IMAGE="core-image-minimal"

# Repositories to clone (or add as submodules).
# Format: "name url branch"
REPOS=(
    "poky git://git.yoctoproject.org/poky.git ${YOCTO_VERSION}"
    "meta-raspberrypi https://git.yoctoproject.org/meta-raspberrypi ${YOCTO_VERSION}"
)

# Compressed image format produced by Yocto for this board
WIC_COMPRESSION="bz2"
