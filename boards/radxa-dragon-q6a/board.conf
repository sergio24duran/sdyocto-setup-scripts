# Board configuration — Radxa Dragon Q6A (QCS6490)
# Sourced by setup.sh to determine what to clone and configure.

BOARD_NAME="Radxa Dragon Q6A"
YOCTO_VERSION="scarthgap"

# Valid machines for this board family
VALID_MACHINES=("qcom-armv8a" "sdradxa-dragon-q6a")
DEFAULT_MACHINE="sdradxa-dragon-q6a"

# Default image to build
DEFAULT_IMAGE="sdradxa-image-minimal"

# Repositories to clone (or add as submodules).
# Format: "name url branch"
REPOS=(
    "poky git://git.yoctoproject.org/poky.git ${YOCTO_VERSION}"
    "meta-openembedded https://github.com/openembedded/meta-openembedded.git ${YOCTO_VERSION}"
    "meta-qcom https://github.com/qualcomm-linux/meta-qcom.git ${YOCTO_VERSION}"
    "meta-sdradxa https://github.com/sergio24duran/meta-sdradxa.git develop"
)

# Compressed image format produced by Yocto for this board
WIC_COMPRESSION="gz"
