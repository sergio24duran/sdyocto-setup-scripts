stages:
  - mirror

mirror_develop_to_github:
  stage: mirror
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - apk add --no-cache git
    # Configure user for automatic commits
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    # Remove GitHub remote if it already exists
    - git remote remove github || true
    # Add GitHub remote using variables
    - git remote add github https://oauth2:${GITHUB_TOKEN}@${GITHUB_REPO_URL#https://}
    # Create local 'develop' branch pointing to current commit
    - git checkout -B develop
    # Force push the 'develop' branch to GitHub
    - git push --force github develop
